name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `next typegen` first: PageProps/LayoutProps are generated by Next, and next-env.d.ts is
      # gitignored, so a fresh checkout has neither. The typecheck script runs it for us.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Deliberately no secrets: the build must not require production credentials, and this
      # step is what proves it stays that way.
      - name: Build
        run: npm run build
